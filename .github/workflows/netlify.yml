name: Validar y Desplegar a Netlify

on:
  push:
    branches:
      - main 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas y validaciones
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Descomenta las siguientes líneas si tu proyecto requiere compilar código antes de subirlo
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
           node-version: '24'
      - name: Instalar dependencias
        run: npm ci
      - name: Construir proyecto
        run: npm run build

        
      - name: Desplegar en Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './' # Cambia esto a './dist' o './build' si usas un comando de build
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy automático por commit ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}